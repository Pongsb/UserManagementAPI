name: Build and verify API

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build UserManagementAPI.sln --configuration Release

      - name: Run integration checks
        run: dotnet run --project tests/UserManagementAPI.Tests --configuration Release --no-build
